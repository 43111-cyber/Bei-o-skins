<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skins</title>
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script src="./assets/js/index.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  </head>
  <body>
    <main>
      <h1 class="logo">Beiço skins🫦</h1>

      <section id="cadastro">
        <form action="#">
          <h2>Cadastro</h2>

          <input
            type="text"
            maxlength="10"
            placeholder="usuario"
            required
            class="campo"
            name="fusuario"
          />

          <input
            type="email"
            maxlength="70"
            placeholder="E-mail"
            required
            class="campo"
            name="femail"
          />

          <input
            type="password"
            maxlength="12"
            minlength="8"
            placeholder="Senha"
            required
            class="campo"
            name="fsenha"
          />
          <input
            type="password"
            maxlength="12"
            minlength="8"
            placeholder="Senha"
            required
            class="campo"
            name="fsenha2"
          />
          <button class="campo botao">Cadastrar</button>
          <a href="#" class="alternar">Já tem conta? Entre!</a>
        </form>
      </section>
      <section id="login">
        <form action="./home.html">
          <h2>Login</h2>
          <input
            type="email"
            maxlength="70"
            placeholder="E-mail"
            required
            class="campo"
            name="femail"
          />
          <input
            type="password"
            maxlength="12"
            minlength="8"
            placeholder="Senha"
            required
            class="campo"
            name="fsenha"
          />
          <button class="campo botao">Login</button>
          <a href="#" class="alternar">Criar Conta</a>
        </form>
      </section>
    </main>
    <div class="banner-container">
      <img src="./assets/img/banner/31c62a55-6309-4715-b3e0-351d6a9c2c3d.png" alt="Beiço Skins - Marketplace de Skins" class="banner">
    </div>
  </body>
</html>
